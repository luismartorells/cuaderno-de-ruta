<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cuaderno de Ruta</title>
<meta name="description" content="Bitácora de viaje en moto: etapas, rutas, gastos y diario.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#252B31">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cuaderno">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* Layout: bitácora de una columna; cabecera fija oscura (asfalto) con estado de guardado y pestañas; tarjetas por bloque; el diario es un feed de publicaciones. */
:root{
  --bg:#ECEEEA; --surface:#FAFBF8; --sunk:#E2E5E0; --ink:#171A1E; --muted:#5D656E; --line:#CDD2CB;
  --accent:#C2410C; --accent-soft:#F6DED0; --on-accent:#FFFFFF; --road:#252B31; --on-road:#EEF0EC; --road-chip:#353C44;
  --ok:#2E7A4C; --warn:#A86A12; --bad:#B42318;
  --map-bg:#E3E8E1; --map-grid:#D2D9CF; --casing:#FFFFFF;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111417; --surface:#1A1E23; --sunk:#14181C; --ink:#E8EBE6; --muted:#98A1AB; --line:#2D333A;
  --accent:#F0793A; --accent-soft:#3A2418; --on-accent:#1A0E07; --road:#0A0C0E; --on-road:#E8EBE6; --road-chip:#22282E;
  --ok:#5CC48A; --warn:#E3A84A; --bad:#F2756A;
  --map-bg:#161B20; --map-grid:#222930; --casing:#0A0C0E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111417; --surface:#1A1E23; --sunk:#14181C; --ink:#E8EBE6; --muted:#98A1AB; --line:#2D333A;
  --accent:#F0793A; --accent-soft:#3A2418; --on-accent:#1A0E07; --road:#0A0C0E; --on-road:#E8EBE6; --road-chip:#22282E;
  --ok:#5CC48A; --warn:#E3A84A; --bad:#F2756A;
  --map-bg:#161B20; --map-grid:#222930; --casing:#0A0C0E; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--road)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--road);color:var(--on-road)}
header .bar{display:flex;align-items:center;gap:12px;justify-content:space-between;padding-block:12px 6px}
.brand{font-family:var(--display);font-weight:700;font-size:1.5rem;letter-spacing:.02em;text-transform:uppercase;line-height:1;min-width:0}
.brand small{display:block;font-family:var(--mono);font-weight:400;font-size:.68rem;letter-spacing:.06em;opacity:.7;margin-top:3px;text-transform:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{display:flex;align-items:center;gap:7px;font-size:.78rem;border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 10px;white-space:nowrap;background:transparent;color:inherit;font-family:var(--body);cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)} .dot.busy{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.dot.busy{animation:none}}
nav.tabs{display:flex;gap:2px}
nav.tabs button{flex:1;min-width:0;background:transparent;border:0;color:inherit;opacity:.65;font-family:var(--display);font-weight:600;font-size:1.02rem;letter-spacing:.05em;text-transform:uppercase;padding:9px 4px 11px;border-bottom:3px solid transparent;cursor:pointer}
nav.tabs button[aria-selected="true"]{opacity:1;border-bottom-color:var(--accent)}
main{padding-block:18px calc(70px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h2{font-family:var(--display);font-weight:700;font-size:1.35rem;letter-spacing:.03em;text-transform:uppercase;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:1.02rem;letter-spacing:.05em;text-transform:uppercase;margin:0;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>*{min-width:0}
.grow{flex:1 1 150px}
label{display:flex;flex-direction:column;gap:4px;font-size:.74rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
label.check{flex-direction:row;align-items:center;gap:10px;text-transform:none;letter-spacing:0;font-size:.95rem;font-weight:500;color:var(--ink);cursor:pointer}
label.check input{width:20px;height:20px;flex:none;accent-color:var(--accent)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:10px 11px;width:100%;min-width:0;text-transform:none;letter-spacing:normal;font-weight:400}
textarea{min-height:64px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,label:focus-within>.addtile{outline:2px solid var(--accent);outline-offset:2px}
.btn{font:inherit;font-weight:600;border-radius:7px;padding:10px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn.small{padding:6px 10px;font-size:.85rem}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.datebar{display:flex;gap:8px;align-items:center}
.datebar input{flex:1;font-family:var(--mono)}
.datebar .btn{padding:10px 12px}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.daylabel{font-family:var(--display);font-size:1.6rem;font-weight:700;line-height:1.1}
.daylabel::first-letter{text-transform:uppercase}
.tripday{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.odo{display:inline-flex;gap:2px;background:var(--road);padding:4px;border-radius:5px;vertical-align:middle}
.odo span{font-family:var(--mono);font-weight:500;color:var(--on-road);background:var(--road-chip);min-width:1.05em;text-align:center;border-radius:2px;padding:1px 2px;font-size:1.02rem}
.odo span.lit{background:var(--accent);color:var(--on-accent)}
.odo-wrap{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:.86rem;padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.chip-group{display:flex;flex-direction:column;gap:6px}
.chip-group b{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.exp-list{display:flex;flex-direction:column}
.exp{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:11px 2px;border-top:1px solid var(--line);cursor:pointer;background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left;font:inherit;color:inherit;width:100%}
.exp:first-child{border-top:0}
.exp .tag{font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:var(--accent-soft);color:var(--ink);padding:3px 8px;border-radius:4px}
.exp .desc{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:.92rem}
.exp .amt{text-align:right;font-family:var(--mono);font-size:.92rem;font-variant-numeric:tabular-nums}
.exp .amt small{display:block;color:var(--muted);font-size:.76rem}
.exp.editing{background:var(--accent-soft)}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--ink);padding-top:10px;font-family:var(--display);font-size:1.3rem;font-weight:700}
.total .mono{font-family:var(--mono);font-size:1.1rem}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.hint{font-size:.86rem;color:var(--muted);margin:0}
.err{color:var(--bad);font-size:.88rem;margin:0}
.okmsg{color:var(--ok);font-size:.88rem;margin:0}
.seg{display:flex;background:var(--sunk);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{flex:1;font:inherit;font-size:.9rem;font-weight:600;border:0;background:transparent;color:var(--muted);padding:8px 6px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stat{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat span{font-family:var(--mono);font-size:1.25rem;font-weight:500;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:minmax(90px,130px) 1fr auto;gap:10px;align-items:center;font-size:.9rem}
.track{height:10px;background:var(--sunk);border-radius:3px;overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:3px}
.g-comidas{background:var(--warn)} .g-moto{background:var(--accent)} .g-tramites{background:var(--ok)} .g-otros{background:var(--muted)}
.bar-row .mono{text-align:right;font-size:.85rem}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{text-align:left;font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--sunk)}
.periodnav{display:flex;align-items:center;gap:8px;justify-content:space-between}
.periodnav .lbl{font-family:var(--display);font-weight:700;font-size:1.3rem;text-align:center;flex:1}
.periodnav .lbl::first-letter{text-transform:uppercase}
.empty{border:1px dashed var(--line);border-radius:10px;padding:18px;color:var(--muted);text-align:center;font-size:.92rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.9rem;z-index:20;max-width:calc(100% - 32px)}
.confirmbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);padding:10px;border-radius:8px;font-size:.92rem}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:.9rem}
.kv b{text-align:right}
.rate-row{display:grid;grid-template-columns:60px 1fr auto;gap:8px;align-items:center}
.ratebox{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.ratebox span{font-family:var(--mono);font-size:.9rem;color:var(--muted)}
/* Ruta tipo Strava */
.route{display:flex;flex-direction:column;gap:10px}
canvas.map{display:block;width:100%;border-radius:8px;background:var(--map-bg)}
.mapwrap{position:relative}
.leaf{width:100%;border-radius:8px;overflow:hidden;position:relative;z-index:0;isolation:isolate;background:var(--map-bg)}
.leaflet-container{font-family:var(--body)}
.mapbtn{position:absolute;right:8px;top:8px;z-index:2;font:inherit;font-size:.8rem;font-weight:600;border:0;border-radius:6px;padding:6px 10px;background:rgba(23,26,30,.78);color:#fff;cursor:pointer}
.bigmap{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column}
.bigmap header{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--road);color:var(--on-road);padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.bigmap header b{font-family:var(--display);font-size:1.2rem;text-transform:uppercase;letter-spacing:.03em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bigmap .leaf,.bigmap canvas{flex:1;border-radius:0}
canvas.prof{display:block;width:100%;height:72px}
.rstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 12px}
.rstat b{display:block;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.rstat span{font-family:var(--mono);font-size:1.02rem;font-variant-numeric:tabular-nums}
/* Diario */
.feedhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.post{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px 14px}
.pplace{font-family:var(--display);font-weight:700;font-size:1.25rem;line-height:1.1;overflow-wrap:anywhere}
.pmeta{font-size:.8rem;color:var(--muted);font-family:var(--mono)}
.pmeta::first-letter{text-transform:uppercase}
.pacts{display:flex;gap:6px;flex:none}
.carwrap{position:relative;background:var(--road)}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.car img{flex:0 0 100%;width:100%;aspect-ratio:4/5;max-height:72vh;object-fit:cover;scroll-snap-align:center;display:block;background:var(--road-chip);color:var(--on-road);font-size:.85rem}
.carcount{position:absolute;top:10px;right:max(10px,env(safe-area-inset-right,0px));background:rgba(0,0,0,.55);color:#fff;font-family:var(--mono);font-size:.75rem;padding:3px 8px;border-radius:999px}
.ptext{padding:12px 14px 4px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:1rem}
.more{background:none;border:0;color:var(--accent);font:inherit;font-weight:600;padding:0 14px 8px;cursor:pointer;text-align:left}
.post .route{padding:10px 14px 14px;border-top:1px solid var(--line);margin-top:8px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.pthumb{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--sunk)}
.pthumb img{width:100%;height:100%;object-fit:cover;display:block}
.pthumb .x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:1rem;line-height:1;cursor:pointer}
.pthumb .l{position:absolute;bottom:4px;left:4px;border:0;border-radius:5px;background:rgba(0,0,0,.6);color:#fff;font-size:.72rem;padding:3px 6px;cursor:pointer}
.pthumb .cov{position:absolute;bottom:4px;left:4px;background:var(--accent);color:var(--on-accent);font-size:.68rem;font-weight:600;padding:2px 6px;border-radius:4px}
.addtile{aspect-ratio:1;border:2px dashed var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:.8rem;text-transform:none;letter-spacing:0;cursor:pointer;text-align:center;padding:6px}
.addtile b{font-size:1.6rem;line-height:1;color:var(--accent)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.trashrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.9rem}
.trashrow:first-child{border-top:0}
.trashrow span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.progress{font-family:var(--mono);font-size:.85rem;color:var(--muted);margin:0}
@media (max-width:420px){.bar-row{grid-template-columns:86px 1fr auto}.daylabel{font-size:1.35rem}.rstats{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand">Cuaderno de Ruta<small id="tripline">Bitácora de viaje en moto</small></div>
      <button class="sync" id="syncBtn" type="button" aria-live="polite"><span class="dot busy" id="syncDot"></span><span id="syncTxt">Abriendo…</span></button>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="dia" aria-selected="true" id="tab-dia">Día</button>
      <button role="tab" data-tab="diario" aria-selected="false" id="tab-diario">Diario</button>
      <button role="tab" data-tab="resumen" aria-selected="false" id="tab-resumen">Resumen</button>
      <button role="tab" data-tab="datos" aria-selected="false" id="tab-datos">Datos</button>
    </nav>
  </div>
</header>
<main class="wrap" id="main"><div class="empty">Abriendo el cuaderno…</div></main>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
/* ================= Constantes ================= */
const DBNAME="cuadernoRuta", MIRROR="cuadernoRuta.v2.mirror", LEGACY="cuadernoRuta.v1", DRAFT_KEY="cuadernoRuta.draft";
const LIB={jspdf:"https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js",pptx:"https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"};
const CATS=[
  {k:"desayuno",n:"Desayuno",g:"comidas"},{k:"comida",n:"Comida",g:"comidas"},{k:"merienda",n:"Merienda",g:"comidas"},{k:"cena",n:"Cena",g:"comidas"},
  {k:"gasolina",n:"Gasolina",g:"moto"},{k:"recambios",n:"Recambios",g:"moto"},{k:"taller",n:"Taller",g:"moto"},
  {k:"seguro",n:"Seguro moto",g:"tramites"},{k:"visado",n:"Visado",g:"tramites"},
  {k:"alojamiento",n:"Alojamiento",g:"otros"},{k:"peajes",n:"Peajes y ferris",g:"otros"},{k:"ropa",n:"Ropa y equipo",g:"otros"},{k:"otros",n:"Otros",g:"otros"}];
const GROUPS={comidas:"Comidas",moto:"Moto",tramites:"Trámites",otros:"Extras"};
const GROUP_RGB={comidas:[168,106,18],moto:[194,65,12],tramites:[46,122,76],otros:[93,101,110]};
const CAT=Object.fromEntries(CATS.map(c=>[c.k,c]));
const CURS=["EUR","USD","GBP","CHF","MAD","TND","EGP","TRY","GEL","AMD","AZN","KZT","UZS","KGS","TJS","RUB","IRR","PKR","INR","NPR","BTN","LKR","THB","LAK","KHR","VND","MYR","IDR","SGD","MNT","CNY","JPY","KRW","AUD","NZD","AED","OMR","SAR","JOD","ZAR","NAD","BWP","KES","TZS","MXN","GTQ","CRC","COP","PEN","BOB","CLP","ARS","UYU","BRL","PYG","NOK","SEK","DKK","ISK","PLN","CZK","HUF","RON","RSD","BAM","MKD","ALL","MDL","UAH"];
const PAL_LIGHT={bg:"#E6EAE3",grid:"#D3D9D0",line:"#C2410C",casing:"#FFFFFF",start:"#2E7A4C",end:"#171A1E",text:"#5D656E"};

/* ================= Utilidades ================= */
function todayStr(){ return ymd(new Date()); }
function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseYmd(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function addDays(s,n){ const d=parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); }
const DATE_RE=/^\d{4}-\d{2}-\d{2}$/;
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function num(v){ if(v===""||v==null) return null; const n=Number(String(v).replace(",",".")); return Number.isFinite(n)?n:null; }
function r1(n){ return Math.round(n*10)/10; }
function r2(n){ return Math.round(n*100)/100; }
const fEur=new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR"});
const fNum=new Intl.NumberFormat("es-ES",{maximumFractionDigits:2});
const fNum1=new Intl.NumberFormat("es-ES",{maximumFractionDigits:1});
const fKm=new Intl.NumberFormat("es-ES",{maximumFractionDigits:0});
function eur(n){ return fEur.format(n||0); }
function money(n,cur){ try{ return new Intl.NumberFormat("es-ES",{style:"currency",currency:cur}).format(n); }catch(e){ return fNum.format(n)+" "+cur; } }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function longDate(s){ return parseYmd(s).toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long",year:"numeric"}); }
function shortDate(s){ return parseYmd(s).toLocaleDateString("es-ES",{weekday:"short",day:"numeric",month:"short"}); }
function shortDateY(s){ return parseYmd(s).toLocaleDateString("es-ES",{day:"numeric",month:"short",year:"numeric"}); }
function cap(s){ s=String(s||""); return s.charAt(0).toUpperCase()+s.slice(1); }
function stamp(prev){ return Math.max(Date.now(),(prev||0)+1); }
function dur(sec){ if(sec==null||!Number.isFinite(sec)) return "—"; let h=Math.floor(sec/3600), m=Math.round((sec%3600)/60); if(m===60){h++;m=0;} return h? h+" h "+String(m).padStart(2,"0")+" min" : m+" min"; }
function eq(a,b){ return JSON.stringify(a)===JSON.stringify(b); }
let toastT; function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2800); }
function withTimeout(p,ms){ return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej({code:"timeout",message:"Sin respuesta"}),ms))]); }
function loadImg(src){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error("img")); i.src=src; }); }
const libP={};
function loadScript(src){ if(libP[src]) return libP[src]; libP[src]=new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=()=>res(); s.onerror=()=>{ delete libP[src]; s.remove(); rej(new Error("No se pudo cargar la herramienta de exportación. Hace falta conexión a internet.")); }; document.head.appendChild(s); }); return libP[src]; }

/* ================= Validación de registros ================= */
function sExp(e){
  if(!e||typeof e!=="object") return null;
  const amount=num(e.amount), ev=num(e.eur); if(amount==null||ev==null) return null;
  const cur=String(e.cur||"EUR").toUpperCase(); const at=Number(e.at)||0;
  return {id:String(e.id||uid()).slice(0,40),cat:CAT[e.cat]?e.cat:"otros",desc:String(e.desc||"").slice(0,300),amount:r2(amount),
    cur:/^[A-Z]{3}$/.test(cur)?cur:"EUR",rate:num(e.rate),eur:r2(ev),at,u:Number(e.u)||at,del:!!e.del};
}
function sDay(date,d){
  if(!DATE_RE.test(date)||!d||typeof d!=="object") return null;
  const ex=(Array.isArray(d.expenses)?d.expenses:[]).map(sExp).filter(Boolean).sort((a,b)=>a.at-b.at||(a.id<b.id?-1:a.id>b.id?1:0));
  const km=num(d.km); const up=Number(d.updatedAt)||0;
  return {kind:"day",date,from:String(d.from||"").slice(0,120),to:String(d.to||"").slice(0,120),km:km==null?null:Math.max(0,r2(km)),
    country:String(d.country||"").slice(0,80),notes:String(d.notes||"").slice(0,20000),fAt:Number(d.fAt)||up,expenses:ex,updatedAt:up};
}
function sTrack(date,t){
  if(!DATE_RE.test(date)||!t||typeof t!=="object") return null;
  const pts=(Array.isArray(t.pts)?t.pts:[]).filter(p=>Array.isArray(p)&&Number.isFinite(p[0])&&Number.isFinite(p[1])&&Math.abs(p[0])<=90&&Math.abs(p[1])<=180)
    .slice(0,2000).map(p=>[+p[0],+p[1],Number.isFinite(p[2])?+p[2]:0,Number.isFinite(p[3])?+p[3]:null]);
  const st=t.stats||{}; const n=k=>num(st[k]);
  return {kind:"track",date,t0:Number(t.t0)||0,pts,stats:{km:n("km")||0,moving:n("moving"),elapsed:n("elapsed"),avg:n("avg"),max:n("max"),gain:n("gain"),approx:!!st.approx},
    src:String(t.src||"").slice(0,40),del:!!t.del,updatedAt:Number(t.updatedAt)||0};
}
function sPost(id,p){
  if(!p||typeof p!=="object"||!/^[A-Za-z0-9_-]{1,60}$/.test(id)) return null;
  const photos=(Array.isArray(p.photos)?p.photos:[]).filter(x=>x&&x.pid).slice(0,10)
    .map(x=>({pid:String(x.pid).slice(0,40),w:Number(x.w)||0,h:Number(x.h)||0,asset:x.asset?String(x.asset).slice(0,64):null}));
  return {kind:"post",id,date:DATE_RE.test(p.date)?p.date:todayStr(),place:String(p.place||"").slice(0,160),text:String(p.text||"").slice(0,200000),
    photos,route:p.route!==false,createdAt:Number(p.createdAt)||0,updatedAt:Number(p.updatedAt)||0,del:!!p.del,delAt:Number(p.delAt)||0};
}
function sSettings(s){
  const out={kind:"settings",rates:{},updatedAt:Number(s&&s.updatedAt)||0};
  if(s&&s.rates&&typeof s.rates==="object") for(const k of Object.keys(s.rates).sort()){ const v=s.rates[k]; const r=num(v&&v.rate); if(r&&r>0&&/^[A-Z]{3}$/.test(k)) out.rates[k]={rate:r,date:String(v.date||"")}; }
  return out;
}
function sBackups(b){
  const items=(b&&Array.isArray(b.items)?b.items:[]).filter(i=>i&&i.id).map(i=>({id:String(i.id).slice(0,64),at:Number(i.at)||0,bytes:Number(i.bytes)||0})).sort((a,c)=>a.at-c.at);
  return {kind:"backups",items,updatedAt:Number(b&&b.updatedAt)||0};
}
function sanitize(key,rec){
  if(typeof key!=="string"||!rec) return null;
  if(key.startsWith("d_")) return sDay(key.slice(2),rec);
  if(key.startsWith("t_")) return sTrack(key.slice(2),rec);
  if(key.startsWith("p_")) return sPost(key.slice(2),rec);
  if(key==="settings") return sSettings(rec);
  if(key==="backups") return sBackups(rec);
  return null;
}
function newerFirst(a,b,f){ f=f||"updatedAt"; if(a[f]>b[f]) return [a,b]; if(b[f]>a[f]) return [b,a]; return JSON.stringify(a)>=JSON.stringify(b)?[a,b]:[b,a]; }
/* Fusión: nunca se pierde nada. Los gastos se unen por id; un registro solo se sustituye por una versión más reciente. */
function mergeRec(key,a,b){
  if(!a) return b; if(!b) return a;
  if(key.startsWith("d_")){
    const [f]=newerFirst(a,b,"fAt"); const map=new Map();
    for(const e of [...a.expenses,...b.expenses]){ const p=map.get(e.id); if(!p||e.u>p.u||(e.u===p.u&&JSON.stringify(e)>JSON.stringify(p))) map.set(e.id,e); }
    return sDay(f.date,{...f,expenses:[...map.values()],updatedAt:Math.max(a.updatedAt,b.updatedAt)});
  }
  if(key==="settings"){ const [n,o]=newerFirst(a,b); return sSettings({rates:{...o.rates,...n.rates},updatedAt:n.updatedAt}); }
  if(key==="backups"){ const m=new Map(); [...a.items,...b.items].forEach(i=>m.set(i.id,i)); return sBackups({items:[...m.values()],updatedAt:Math.max(a.updatedAt,b.updatedAt)}); }
  if(key.startsWith("p_")){
    const [n,o]=newerFirst(a,b); const m=clone(n);
    for(const ph of m.photos) if(!ph.asset){ const f=o.photos.find(x=>x.pid===ph.pid); if(f&&f.asset) ph.asset=f.asset; }
    return sPost(m.id,m);
  }
  return newerFirst(a,b)[0];
}

/* ================= Almacén local (IndexedDB + copia espejo) ================= */
function idbOpen(){ return new Promise(res=>{ try{ const rq=indexedDB.open(DBNAME,1);
  rq.onupgradeneeded=()=>{ const d=rq.result; ["kv","photos","snaps"].forEach(s=>{ if(!d.objectStoreNames.contains(s)) d.createObjectStore(s); }); };
  rq.onsuccess=()=>res(rq.result); rq.onerror=()=>res(null); rq.onblocked=()=>res(null); setTimeout(()=>res(null),6000);
}catch(e){ res(null); } }); }
function idbReq(store,mode,fn){ return new Promise((res,rej)=>{ if(!idb) return rej(new Error("sin almacén")); try{ const t=idb.transaction(store,mode); const r=fn(t.objectStore(store)); t.oncomplete=()=>res(r?r.result:undefined); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); }catch(e){ rej(e); } }); }
const idbGet=(s,k)=>idbReq(s,"readonly",st=>st.get(k));
const idbPut=(s,k,v)=>idbReq(s,"readwrite",st=>st.put(v,k));
const idbDel=(s,k)=>idbReq(s,"readwrite",st=>st.delete(k));
const idbKeys=s=>idbReq(s,"readonly",st=>st.getAllKeys());
function idbEntries(store){ return new Promise((res,rej)=>{ if(!idb) return res([]); const out=[]; try{ const t=idb.transaction(store,"readonly"); const c=t.objectStore(store).openCursor();
  c.onsuccess=()=>{ const cur=c.result; if(cur){ out.push([cur.key,cur.value]); cur.continue(); } }; t.oncomplete=()=>res(out); t.onerror=()=>rej(t.error); }catch(e){ rej(e); } }); }

const dirty=new Set(); let idbTimer=null;
function writeMirror(){
  try{ const recs={}; for(const [k,v] of R) if(!k.startsWith("t_")) recs[k]=v;
    localStorage.setItem(MIRROR,JSON.stringify({v:2,recs,pending:[...pending],meta})); mirrorOk=true; }
  catch(e){ mirrorOk=false; }
}
let idbChain=Promise.resolve();
function writeIdb(){ idbChain=idbChain.then(writeIdbNow,writeIdbNow); return idbChain; }
async function savedToDisk(){ clearTimeout(idbTimer); idbTimer=null; writeMirror(); await writeIdb(); }
async function writeIdbNow(){
  if(!idb) return; const keys=[...dirty]; dirty.clear();
  try{ await new Promise((res,rej)=>{ const t=idb.transaction("kv","readwrite"); const st=t.objectStore("kv");
      for(const k of keys){ const v=R.get(k); if(v) st.put(v,k); } st.put([...pending],"__pending"); st.put(meta,"__meta");
      t.oncomplete=res; t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); }); idbOk=true; }
  catch(e){ keys.forEach(k=>dirty.add(k)); idbOk=false; }
  renderSync();
}
function persist(){ writeMirror(); if(!idbTimer) idbTimer=setTimeout(()=>{ idbTimer=null; writeIdb(); },0); renderSync(); }
function setRec(key,rec,push){
  const s=sanitize(key,rec); if(!s) return false;
  R.set(key,s); dirty.add(key); if(push!==false) pending.add(key);
  persist(); scheduleFlush(); snapshotSoon(); return true;
}
/* Copias automáticas en el móvil: una por día, se guardan las últimas 21 */
let snapTimer=null;
function snapshotSoon(){ clearTimeout(snapTimer); snapTimer=setTimeout(()=>takeSnapshot(false),45000); }
async function takeSnapshot(force){
  if(!idb||!R.size) return; const today=todayStr();
  if(!force&&meta.lastSnap===today&&Date.now()-meta.lastSnapAt<3*3600000) return;
  try{ await idbPut("snaps",today,{at:Date.now(),recs:Object.fromEntries(R)}); meta.lastSnap=today; meta.lastSnapAt=Date.now();
    const keys=(await idbKeys("snaps")).sort(); for(const k of keys.slice(0,Math.max(0,keys.length-21))) await idbDel("snaps",k); persist(); }catch(e){}
}

/* ================= Registros ================= */
function getDay(date){ return R.get("d_"+date)||sDay(date,{}); }
function trackFor(date){ const t=R.get("t_"+date); return t&&!t.del&&t.pts.length>1?t:null; }
function liveExp(d){ return d.expenses.filter(e=>!e.del); }
function dayTotal(d){ return r2(liveExp(d).reduce((s,e)=>s+e.eur,0)); }
function saveDayFields(date,patch){ const d=clone(getDay(date)); Object.assign(d,patch); d.fAt=stamp(d.fAt); d.updatedAt=stamp(d.updatedAt); setRec("d_"+date,d); }
function upsertExpense(date,exp){ const d=clone(getDay(date)); const i=d.expenses.findIndex(e=>e.id===exp.id); exp.u=stamp(i>=0?d.expenses[i].u:0); if(i>=0) d.expenses[i]=exp; else d.expenses.push(exp); d.updatedAt=stamp(d.updatedAt); setRec("d_"+date,d); }
function setExpenseDel(date,id,del){ const d=clone(getDay(date)); const e=d.expenses.find(x=>x.id===id); if(!e) return; e.del=del; e.u=stamp(e.u); d.updatedAt=stamp(d.updatedAt); setRec("d_"+date,d); }
function saveRate(cur,rate){
  if(!cur||cur==="EUR"||!(rate>0)) return; const prev=(R.get("settings")||sSettings({})); const old=prev.rates[cur];
  if(old&&Math.abs(old.rate-rate)<1e-9) return; const s=clone(prev); s.rates[cur]={rate:Math.round(rate*10000)/10000,date:todayStr()}; s.updatedAt=stamp(s.updatedAt); setRec("settings",s);
}
function rates(){ return (R.get("settings")||sSettings({})).rates; }
function posts(){ return [...R.values()].filter(v=>v.kind==="post"&&!v.del).sort((a,b)=>(a.date<b.date?1:a.date>b.date?-1:b.createdAt-a.createdAt)); }
function allDates(){ const s=new Set(); for(const v of R.values()){ if(v.kind==="day"&&(v.km!=null||v.from||v.to||v.notes||liveExp(v).length)) s.add(v.date); else if((v.kind==="track"||v.kind==="post")&&!v.del) s.add(v.date); } return [...s].sort(); }
function tripStart(){ return allDates()[0]||null; }
function tripDayNum(date){ const s=tripStart(); if(!s||date<s) return null; return Math.round((parseYmd(date)-parseYmd(s))/86400000)+1; }

/* ================= Fotos ================= */
async function putPhoto(pid,rec){ if(idb){ try{ await idbPut("photos",pid,rec); return true; }catch(e){} } memPhotos.set(pid,rec); return false; }
async function getPhoto(pid){ if(memPhotos.has(pid)) return memPhotos.get(pid); if(idb){ try{ return await idbGet("photos",pid); }catch(e){} } return null; }
const urlCache=new Map();
async function photoFromDrive(ph){
  if(!ph.asset||!cfg.url||navigator.onLine===false) return null;
  try{ const j=await api("getphoto",{id:ph.asset},90000); const bin=atob(j.b64); const arr=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    const blob=new Blob([arr],{type:"image/jpeg"}); await putPhoto(ph.pid,{blob,w:ph.w||0,h:ph.h||0,asset:ph.asset,at:Date.now()}); return blob; }catch(e){ return null; }
}
async function photoSrc(ph){
  if(urlCache.has(ph.pid)) return urlCache.get(ph.pid);
  const r=await getPhoto(ph.pid); const b=r&&r.blob?r.blob:await photoFromDrive(ph); if(!b) return null;
  const u=URL.createObjectURL(b); urlCache.set(ph.pid,u); return u;
}
async function photoBlob(ph){ const r=await getPhoto(ph.pid); if(r&&r.blob) return r.blob; return await photoFromDrive(ph); }
async function processImage(file){
  const url=URL.createObjectURL(file);
  try{ const img=await loadImg(url); let w=img.naturalWidth,h=img.naturalHeight; const sc=Math.min(1,2048/Math.max(w,h)); w=Math.round(w*sc); h=Math.round(h*sc);
    const c=document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").drawImage(img,0,0,w,h);
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.84)); if(!blob) throw new Error("jpeg"); return {blob,w,h}; }
  finally{ URL.revokeObjectURL(url); }
}
async function photoData(ph,max){
  const b=await photoBlob(ph); if(!b) return null; const url=URL.createObjectURL(b);
  try{ const img=await loadImg(url); let w=img.naturalWidth,h=img.naturalHeight; const sc=Math.min(1,max/Math.max(w,h)); w=Math.round(w*sc); h=Math.round(h*sc);
    const c=document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").drawImage(img,0,0,w,h); return {data:c.toDataURL("image/jpeg",0.78),w,h}; }
  catch(e){ return null; } finally{ URL.revokeObjectURL(url); }
}

/* ================= Copia en Google Drive (script de Google de su propia cuenta) ================= */
const CFG_KEY="cuadernoRuta.drive";
let cfg={url:"",key:""};
const sync={state:"off",busy:false,again:false,lastError:"",photosLeft:0};
function genKey(){ const a="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789"; const b=new Uint8Array(32); crypto.getRandomValues(b); return [...b].map(x=>a[x%a.length]).join(""); }
function loadCfg(){
  try{ const o=JSON.parse(localStorage.getItem(CFG_KEY)||"null"); if(o&&typeof o.key==="string") cfg={url:String(o.url||""),key:o.key}; }catch(e){}
  if(!cfg.key&&meta.cfg&&meta.cfg.key) cfg={url:String(meta.cfg.url||""),key:meta.cfg.key};
}
function saveCfg(){ try{ localStorage.setItem(CFG_KEY,JSON.stringify(cfg)); }catch(e){} meta.cfg={...cfg}; persist(); }
function validUrl(u){ return /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(u); }
async function api(action,payload,ms){
  if(!cfg.url||!cfg.key) throw {code:"noconfig"};
  let res;
  try{ res=await withTimeout(fetch(cfg.url,{method:"POST",body:JSON.stringify({key:cfg.key,action,...(payload||{})}),redirect:"follow"}),ms||60000); }
  catch(e){ throw {code:(e&&e.code)||"network"}; }
  if(!res.ok) throw {code:"http",message:"Drive respondió con error "+res.status};
  let j; try{ j=await res.json(); }catch(e){ throw {code:"badresp"}; }
  if(!j||!j.ok) throw {code:(j&&j.error)||"error",message:j&&j.message};
  return j;
}
function apiErrMsg(e){
  const c=e&&e.code;
  if(c==="bad_key") return "La clave no coincide con la del script. Revisa que pegaste en el script la clave que muestra la app.";
  if(c==="badresp") return "El script no responde como debe. Revisa que esté implementado como aplicación web con acceso «Cualquier usuario».";
  if(c==="shrink") return e.message||"Drive ha frenado una copia con muchos menos datos que la anterior. No se ha sobrescrito nada.";
  if(c==="busy") return "Drive estaba ocupado. Se vuelve a intentar sola.";
  if(c==="network"||c==="timeout") return "Sin conexión con Drive ahora. Se sube sola al volver la cobertura.";
  if(c==="noconfig") return "Drive no está conectado.";
  return "Drive devolvió un error"+(e&&e.message?": "+String(e.message).slice(0,160):".");
}
function blobToB64(blob){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(String(fr.result).split(",")[1]||""); fr.onerror=()=>rej(fr.error); fr.readAsDataURL(blob); }); }
function countNonTrack(){ let n=0; for(const k of R.keys()) if(!k.startsWith("t_")) n++; return n; }
function stateExport(){ const recs={}; for(const [k,v] of R) if(!k.startsWith("t_")) recs[k]=v; return {app:"cuaderno-de-ruta",v:2,exportedAt:new Date().toISOString(),recs}; }
function fullExport(){ return {app:"cuaderno-de-ruta",v:2,exportedAt:new Date().toISOString(),recs:Object.fromEntries(R)}; }
function photosPendingCount(){ let n=0; for(const p of posts()) for(const ph of p.photos) if(!ph.asset) n++; return n; }
async function uploadPhotos(limit){
  let n=0,left=0;
  for(const p of posts()){
    const done={};
    for(const ph of p.photos){ if(ph.asset) continue; left++; if(n>=limit) continue;
      const local=await getPhoto(ph.pid); if(!local||!local.blob) continue;
      if(local.asset){ done[ph.pid]=local.asset; left--; continue; }
      const j=await api("photo",{name:p.date+"_"+ph.pid+".jpg",b64:await blobToB64(local.blob)},180000);
      local.asset=j.id; await putPhoto(ph.pid,local); done[ph.pid]=j.id; n++; left--;
    }
    if(Object.keys(done).length){ const cur=clone(R.get("p_"+p.id)); cur.photos.forEach(ph=>{ if(!ph.asset&&done[ph.pid]) ph.asset=done[ph.pid]; }); cur.updatedAt=stamp(cur.updatedAt); setRec("p_"+p.id,cur); }
  }
  sync.photosLeft=left;
}
let syncTimer=null, retryTimer=null;
function scheduleFlush(ms){ clearTimeout(syncTimer); syncTimer=setTimeout(runSync,ms==null?3000:ms); }
async function runSync(){
  if(sync.busy){ sync.again=true; return; }
  if(!cfg.url){ sync.state="off"; renderSync(); return; }
  if(navigator.onLine===false){ sync.state="offline"; renderSync(); return; }
  sync.busy=true; sync.again=false; renderSync();
  try{
    for(const key of [...pending].filter(k=>k.startsWith("t_"))){
      const t=R.get(key); if(!t){ pending.delete(key); continue; }

    layer.on("tileload",()=>ok++); layer.on("tileerror",()=>{ bad++; if(bad>=2) fallback(); }); setTimeout(fallback,8000);
    const pal=cssPal();

    m.fitBounds(L.latLngBounds(lines.flat()),{padding:[26,26],maxZoom:14});
    if(cv) cv.hidden=true;

function saveExpense(){
  const errEl=document.getElementById("expErr"); const fail=m=>{ errEl.textContent=m; errEl.hidden=false; };
  const amount=num(val("eAmt")),cur=(val("eCur")||"EUR").toUpperCase();
  if(amount==null||amount<=0) return fail("Escribe un importe mayor que cero.");
  if(!/^[A-Z]{3}$/.test(cur)) return fail("La divisa son 3 letras, por ejemplo GEL o TRY.");
  let rate=1,ev=amount;
  if(cur!=="EUR"){ const ee=num(val("eEur")),rr=num(val("eRate"));
    if(ee!=null&&ee>0){ ev=ee; rate=amount/ee; } else if(rr!=null&&rr>0){ rate=rr; ev=amount/rr; }
    else return fail("Falta el cambio: cuántos "+cur+" vale 1 € o el importe en € que cobró el banco.");
    saveRate(cur,rate); }
  const prev=ui.editId?getDay(ui.date).expenses.find(e=>e.id===ui.editId):null;
  const exp={id:ui.editId||uid(),cat:ui.cat,desc:val("eDesc"),amount:r2(amount),cur,rate,eur:r2(ev),at:prev?prev.at:Date.now(),del:false};
  const wasEdit=!!ui.editId; upsertExpense(ui.date,exp); ui.editId=null; ui.confirmDel=null; render();
  toast(wasEdit?"Gasto actualizado":"Gasto añadido · "+eur(exp.eur));
}

function bindDiary(){
  const on=(id,fn)=>{ const el=document.getElementById(id); if(el) el.onclick=fn; };
  on("newPost",()=>{ openComposer(null,ui.date); render(); window.scrollTo(0,0); });
  if(ui.draft){
    const sync=()=>{ ui.draft.date=DATE_RE.test(val("pDate"))?val("pDate"):ui.draft.date; ui.draft.place=document.getElementById("pPlace").value; ui.draft.text=document.getElementById("pText").value; ui.draft.route=document.getElementById("pRoute").checked; saveDraft(); };
    ["pPlace","pText"].forEach(id=>document.getElementById(id).addEventListener("input",sync));
    document.getElementById("pRoute").onchange=sync;
    document.getElementById("pDate").onchange=()=>{ sync(); render(); };
    const pf=document.getElementById("pFiles");
    if(pf) pf.onchange=async e=>{ sync(); const files=[...(e.target.files||[])]; const room=10-ui.draft.photos.length; ui.draftErr="";
      if(files.length>room) ui.draftErr="Máximo 10 fotos por publicación: se han añadido "+room+".";
      for(const f of files.slice(0,room)){ try{ const {blob,w,h}=await processImage(f); const pid=uid(); const saved=await putPhoto(pid,{blob,w,h,asset:null,at:Date.now()});
          if(!saved) ui.draftErr="Este navegador no deja guardar fotos en el móvil; súbelas con conexión para que queden en la nube."; ui.draft.photos.push({pid,w,h,asset:null}); saveDraft(); }
        catch(err){ ui.draftErr="No se pudo leer una de las fotos ("+f.name+")."; } }
      render(); };
    document.querySelectorAll("[data-rmphoto]").forEach(b=>b.onclick=()=>{ sync(); ui.draft.photos.splice(+b.dataset.rmphoto,1); saveDraft(); render(); });
    document.querySelectorAll("[data-left]").forEach(b=>b.onclick=()=>{ sync(); const i=+b.dataset.left; const a=ui.draft.photos; [a[i-1],a[i]]=[a[i],a[i-1]]; saveDraft(); render(); });
    on("pCancel",()=>{ ui.draft=null; clearDraft(); render(); });

      if(!dr.photos.length&&!dr.text.trim()){ ui.draftErr="Añade al menos una foto o un texto."; render(); return; }

      ui.draft=null; clearDraft(); render(); toast(dr.id?"Publicación actualizada":"Publicado en el diario"); });
  }
  document.querySelectorAll("[data-editpost]").forEach(b=>b.onclick=()=>{ const p=R.get("p_"+b.dataset.editpost); if(p){ openComposer(p); render(); window.scrollTo(0,0); } });

  document.querySelectorAll("[data-delno]").forEach(b=>b.onclick=()=>{ ui.confirmPost=null; render(); });
  document.querySelectorAll("[data-delyes]").forEach(b=>b.onclick=()=>{ const p=clone(R.get("p_"+b.dataset.delyes)); p.del=true; p.delAt=Date.now(); p.updatedAt=stamp(p.updatedAt); setRec("p_"+p.id,p); ui.confirmPost=null; render(); toast("Publicación en la papelera"); });

function trashItems(){
  const out=[];
  for(const v of R.values()){
    if(v.kind==="day") v.expenses.filter(e=>e.del).forEach(e=>out.push({type:"exp",date:v.date,id:e.id,label:shortDate(v.date)+" · "+CAT[e.cat].n+" · "+(e.cur==="EUR"?eur(e.amount):money(e.amount,e.cur))}));
    else if(v.kind==="post"&&v.del) out.push({type:"post",date:v.date,id:v.id,label:shortDate(v.date)+" · Diario · "+(v.place||v.text.slice(0,40)||"publicación")});

  return out.sort((a,b)=>a.date<b.date?1:-1);
}

async function offerFile(filename,data,mime){
  const blob=data instanceof Blob?data:new Blob([data],{type:mime||"application/octet-stream"});
  try{ const file=new File([blob],filename,{type:blob.type||mime||"application/octet-stream"});
    if(/iPhone|iPad|iPod/.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:filename}); return true; } }
  catch(e){ if(e&&e.name==="AbortError") return false; }
  const u=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=u; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),60000);
  return true;
}
function mergeImport(o){
  let n=0; const recs={};
  if(o&&o.recs&&typeof o.recs==="object") Object.assign(recs,o.recs);
  if(o&&o.days&&typeof o.days==="object") for(const [d,v] of Object.entries(o.days)) recs["d_"+d]=v;
  if(o&&o.settings&&!recs.settings) recs.settings=o.settings;
  for(const [k,v] of Object.entries(recs)){ const s=sanitize(k,v); if(!s) continue; const l=R.get(k)||null; const m=mergeRec(k,l,s);
    if(!l||!eq(m,l)){ R.set(k,m); dirty.add(k); pending.add(k); n++; } }
  persist(); scheduleFlush(800); return n;
}

/* ================= Exportación: datos comunes ================= */
function collectExport(rg){
  const dates=allDates().filter(d=>d>=rg.start&&d<=rg.end);
  const ps=posts().filter(p=>p.date>=rg.start&&p.date<=rg.end).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.createdAt-b.createdAt);
  const postsBy={}; ps.forEach(p=>(postsBy[p.date]=postsBy[p.date]||[]).push(p));
  const sum=summarize(rg.start,rg.end);
  return {...rg,dates,posts:ps,postsBy,tracks:tracksIn(rg.start,rg.end),sum};
}

  const cats=Object.entries(s.byCat).sort((a,b)=>a[1]-b[1]);
  if(cats.length){ sl=p.addSlide(); sl.background={color:BG}; title(sl,"En qué se ha ido el dinero");
    sl.addChart(p.ChartType.bar,[{name:"Gasto",labels:cats.map(c=>CAT[c[0]].n),values:cats.map(c=>r2(c[1]))}],{x:0.5,y:1.3,w:7.6,h:5.8,barDir:"bar",chartColors:[ACC],
      showValue:true,dataLabelFormatCode:'#,##0 "€"',dataLabelFontSize:11,dataLabelColor:INK,catAxisLabelFontSize:12,catAxisLabelColor:INK,catAxisLabelFontFace:F,valAxisHidden:true,valGridLine:{style:"none"},showLegend:false});
    const hd=t=>({text:t,options:{bold:true,color:MUT,fill:{color:BG}}});
    const rows=[[hd("Divisa"),hd("Pagado"),hd("En €")]].concat(Object.entries(s.byCur).sort((a,b)=>b[1].eur-a[1].eur).slice(0,12).map(([c,v])=>[c,{text:fNum.format(r2(v.amount)),options:{align:"right"}},{text:eurTxt(v.eur),options:{align:"right"}}]));
    rows.push([{text:"Total",options:{bold:true}},"",{text:eurTxt(s.eur),options:{bold:true,align:"right"}}]);
    sl.addTable(rows,{x:8.5,y:1.3,w:4.3,colW:[1.0,1.7,1.6],fontFace:F,fontSize:12,color:INK,border:{type:"solid",pt:0.5,color:LINE},fill:{color:WH}}); }
  /* Etapas */
  const st=X.dates.map(date=>{ const d=getDay(date); return [cap(shortDate(date)),(d.from||"—")+" → "+(d.to||"—"),d.km!=null?fKm.format(d.km):"—",eurTxt(dayTotal(d))]; });
  const chunks=[]; for(let k=0;k<st.length;k+=12) chunks.push(st.slice(k,k+12));
  chunks.forEach((ch,k)=>{ sl=p.addSlide(); sl.background={color:BG}; title(sl,"Etapas"+(chunks.length>1?" ("+(k+1)+"/"+chunks.length+")":""));
    const hd=t=>({text:t,options:{bold:true,color:MUT,fill:{color:BG}}});
    sl.addTable([[hd("Fecha"),hd("Recorrido"),hd("Km"),hd("Gasto")]].concat(ch.map(r=>[r[0],r[1],{text:r[2],options:{align:"right"}},{text:r[3],options:{align:"right"}}])),
      {x:0.5,y:1.3,w:12.3,colW:[2.0,7.2,1.4,1.7],fontFace:F,fontSize:12,color:INK,border:{type:"solid",pt:0.5,color:LINE},fill:{color:WH}}); });
  /* Publicaciones del diario */
  let n=0;
  for(const post of X.posts){ n++; prog("Diapositiva del diario "+n+" de "+X.posts.length+"…"); await tick();
    sl=p.addSlide(); sl.background={color:WH};
    const ims=[]; for(const ph of post.photos.slice(0,4)){ const im=await photoData(ph,1600); if(im) ims.push(im); }
    const A={x:0.35,y:0.35,w:7.6,h:6.8}; const cells=ims.length===1?[A]:ims.length===2?[{x:A.x,y:A.y,w:A.w/2-0.05,h:A.h},{x:A.x+A.w/2+0.05,y:A.y,w:A.w/2-0.05,h:A.h}]
      :[0,1,2,3].map(i=>({x:A.x+(i%2)*(A.w/2+0.05),y:A.y+Math.floor(i/2)*(A.h/2+0.05),w:A.w/2-0.05,h:A.h/2-0.05}));
    ims.forEach((im,i)=>{ const c=cells[i]; const r=im.w/im.h; let w=c.w,h=w/r; if(h>c.h){ h=c.h; w=h*r; } sl.addImage({data:strip(im.data),x:c.x+(c.w-w)/2,y:c.y+(c.h-h)/2,w,h}); });
    const tx=ims.length?8.3:0.6, tw=ims.length?4.6:12.1; const dn=tripDayNum(post.date); const t=post.route?trackFor(post.date):null;
    sl.addText(cap(longDate(post.date))+(dn?"  ·  día "+dn:""),{x:tx,y:0.45,w:tw,h:0.4,fontFace:F,fontSize:12,color:MUT});
    sl.addText(post.place||"Diario",{x:tx,y:0.85,w:tw,h:0.75,fontFace:F,fontSize:24,bold:true,color:INK,fit:"shrink"});
    if(post.text) sl.addText(post.text.length>1400?post.text.slice(0,1400)+"…":post.text,{x:tx,y:1.7,w:tw,h:t?2.6:5.2,fontFace:F,fontSize:13,color:INK,valign:"top",fit:"shrink"});
    if(post.photos.length>4) sl.addText("+"+(post.photos.length-4)+" fotos más en la app",{x:A.x,y:7.1,w:A.w,h:0.3,fontFace:F,fontSize:10,color:MUT});
    if(t){ sl.addText(fNum1.format(t.stats.km)+" km"+(t.stats.moving?" · "+dur(t.stats.moving):"")+(t.stats.avg?" · media "+fNum1.format(t.stats.avg)+" km/h":""),{x:tx,y:4.4,w:tw,h:0.35,fontFace:F,fontSize:11,bold:true,color:ACC});
      sl.addImage({data:strip(mapImage([t],920,520,PAL_LIGHT)),x:tx,y:4.8,w:tw,h:tw*520/920}); } }
  /* Rutas sin publicación */
  const lone=X.dates.filter(d=>trackFor(d)&&!(X.postsBy[d]||[]).some(p=>p.route));
  for(let k=0;k<lone.length;k+=2){ prog("Mapas de rutas…"); await tick(); sl=p.addSlide(); sl.background={color:BG}; title(sl,"Rutas");
    lone.slice(k,k+2).forEach((date,j)=>{ const t=trackFor(date),d=getDay(date),x=0.5+j*6.25;
      sl.addImage({data:strip(mapImage([t],1200,760,PAL_LIGHT)),x,y:1.3,w:6.0,h:3.8});
      sl.addText(cap(shortDate(date))+" · "+(d.from||"—")+" → "+(d.to||"—"),{x,y:5.2,w:6.0,h:0.45,fontFace:F,fontSize:15,bold:true,color:INK});
      sl.addText(statsLine(t.stats),{x,y:5.65,w:6.0,h:0.8,fontFace:F,fontSize:11,color:MUT,valign:"top"}); }); }
  prog("Componiendo la presentación…"); await tick();
  return await p.write({outputType:"blob"});
}

/* ================= Navegación y arranque ================= */
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{ ui.tab=b.dataset.tab; ui.needsRender=false; render(); window.scrollTo(0,0); });
document.getElementById("syncBtn").onclick=()=>{ ui.tab="datos"; render(); window.scrollTo(0,0); };
document.getElementById("main").addEventListener("click",e=>{
  const per=e.target.closest("[data-per]"); if(per){ ui.period=per.dataset.per; render(); return; }
  if(e.target.closest("#perPrev")){ ui.anchor=shiftAnchor(ui.period,ui.anchor,-1); render(); return; }
  if(e.target.closest("#perNext")){ ui.anchor=shiftAnchor(ui.period,ui.anchor,1); render(); return; }
  const go=e.target.closest("[data-goto]"); if(go){ ui.date=go.dataset.goto; ui.tab="dia"; ui.editId=null; render(); window.scrollTo(0,0); }
});
async function boot(){
  idb=await idbOpen(); idbOk=!!idb;
  if(idb){ try{ for(const [k,v] of await idbEntries("kv")){
      if(k==="__pending"){ if(Array.isArray(v)) v.forEach(x=>pending.add(x)); }
      else if(k==="__meta"){ if(v&&typeof v==="object") meta={...meta,...v}; }
      else { const s=sanitize(k,v); if(s) R.set(k,s); } } }catch(e){} }
  try{ const raw=localStorage.getItem(MIRROR); if(raw){ const o=JSON.parse(raw);
      for(const [k,v] of Object.entries(o.recs||{})){ const s=sanitize(k,v); if(!s) continue; const l=R.get(k)||null; const m=mergeRec(k,l,s); if(!l||!eq(m,l)){ R.set(k,m); dirty.add(k); } }
      (o.pending||[]).forEach(x=>pending.add(x)); if(!idb&&o.meta) meta={...meta,...o.meta}; } }catch(e){}
  try{ const dr=JSON.parse(localStorage.getItem(DRAFT_KEY)||"null"); if(dr&&Array.isArray(dr.photos)&&DATE_RE.test(dr.date)) ui.draft=dr; }catch(e){}
  loadCfg(); if(!cfg.key){ cfg.key=genKey(); }
  booted=true; saveCfg(); persist(); render(); takeSnapshot(false);
  try{ if(navigator.storage&&navigator.storage.persist){ persistent=await navigator.storage.persisted(); if(!persistent) persistent=await navigator.storage.persist(); } }catch(e){}
  if("serviceWorker" in navigator){ try{ await navigator.serviceWorker.register("sw.js"); }catch(e){} }
  setTimeout(runSync,1500);
}
boot();
</script>
